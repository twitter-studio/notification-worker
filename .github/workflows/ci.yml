name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main への push の run は止めない (続けてマージしたとき、各 commit の結果を残すため)。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # go install は sum.golang.org で中身を確かめる (組織の .github と同じ)。
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: zizmor
        # 外部の Action の hash での固定、本家の履歴にない commit、版のコメントのずれなどを調べる。
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --config zizmor.yml .
      # pnpm の版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # mise.toml の node とそろえる。
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # デプロイはしない (--dry-run)。Cloudflare の資格情報は CI に渡さない。
      - run: pnpm build
