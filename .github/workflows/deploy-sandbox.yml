name: Sandbox deployment

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 配置するmainの完全なcommit SHA
        required: true
        type: string
      confirmation:
        description: 停止構成は deploy:SHA、X入口の有効化は deploy-x:SHA
        required: true
        type: string
      x_activity_enabled:
        description: X入口とXイベント処理を有効化する
        type: boolean
        default: false
      maintenance_confirmed:
        description: 購読とQueueの状態・保守範囲の承認を確認した
        required: true
        default: false
        type: boolean
      public_relay_trial_until:
        description: 公開中継試験の終了時刻（UTCのYYYY-MM-DDTHH:MM:SSZ）
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sandbox-maintenance
  cancel-in-progress: false

env:
  DEPLOY_OPERATION: deploy
  DEPLOY_X_ACTIVITY: ${{ inputs.x_activity_enabled }}
  PUBLIC_RELAY_TRIAL_UNTIL: ${{ inputs.public_relay_trial_until }}
  DEPLOY_SHA: ${{ inputs.target_sha }}
  DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
  MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
  SCHEMA_CONFIRMED: "true"
  BACKUP_CONFIRMED: "false"
  SANDBOX_DEPLOY_ENABLED: ${{ vars.SANDBOX_DEPLOY_ENABLED }}
  DEPLOY_REVIEWER: ${{ vars.DEPLOY_REVIEWER }}

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Environment保護と同じSHAのCIを確認する
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-gate.mjs worker
  operate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 配置前のdry-run（Cloudflareの資格情報なし）
        run: pnpm build
      - name: 承認したsandbox操作と結果確認
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_SUBDOMAIN: ${{ vars.CF_WORKER_SUBDOMAIN }}
          CF_QUEUE_ID: ${{ vars.CF_QUEUE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: node scripts/deploy-sandbox.mjs
